<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إكمال التسجيل - BTEC Cloud</title><link rel="icon" href="logo.svg"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><style>
.toast-container{position:fixed;top:20px;right:20px;z-index:3000}.toast{background:#182033;color:#fff;padding:14px 20px;border-radius:12px;margin-bottom:9px;border-right:4px solid #ff4b2b}.toast.success{border-color:#00d7a0}.input-group{position:relative}.toggle-password{position:absolute;left:15px;top:43px;cursor:pointer;color:#777}.input-group input{padding-left:44px}.helper{font-size:12px;color:#aab4c5;margin-top:5px}.identity-email{color:#4facfe;text-align:center;margin-bottom:18px;direction:ltr}
</style></head><body><div class="css-shape shape-1" style="--rot:-35deg"></div><div class="css-shape shape-2" style="--rot:20deg"></div><div class="css-shape shape-3" style="--rot:45deg"></div><div class="css-shape shape-4"></div><div id="toast-container" class="toast-container"></div>
<div class="glass-card"><div class="brand-logo"><div class="brand-text"><span class="title">BTEC Cloud</span><span class="subtitle">IT Student Portal</span></div></div><h2 class="login-title">إكمال تسجيل الطالب</h2><p style="color:#ddd;text-align:center;font-size:14px">أكمل بياناتك حتى تتمكن من استخدام المنصة.</p><div id="account-email" class="identity-email">جارٍ التحقق من الحساب...</div>
<form id="complete-form" novalidate><div class="input-group"><label for="full-name">الاسم الرباعي (4 إلى 6 أسماء)</label><input id="full-name" type="text" autocomplete="name" placeholder="محمد أحمد علي خالد" required><div class="helper">يسمح بالأسماء المركبة حتى 6 كلمات.</div></div><div class="input-group"><label for="national-id">الرقم الوطني</label><input id="national-id" type="text" inputmode="numeric" maxlength="10" placeholder="10 أرقام بالضبط" required></div><div class="input-group"><label for="new-password">كلمة مرور إضافية للدخول بالبريد</label><input id="new-password" type="password" autocomplete="new-password" placeholder="8 أحرف على الأقل" required><i class="fas fa-eye-slash toggle-password" id="password-eye"></i></div><button type="submit" class="submit-btn" id="complete-btn">حفظ وإكمال التسجيل</button></form><p style="font-size:12px;color:#bbb;text-align:center;margin-top:15px">ستُربط كلمة المرور بحسابك الحالي ولن يتم إنشاء حساب منفصل.</p></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
import{getAuth,onAuthStateChanged,EmailAuthProvider,linkWithCredential,sendEmailVerification}from"https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
import{getFirestore,doc,getDoc}from"https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyDU_rKS6aUxflVRNzFPAvxdGFSKaFHgmaE",authDomain:"btec-cloud-portal.vercel.app",projectId:"btec-cloud-portal-d6a93",storageBucket:"btec-cloud-portal-d6a93.firebasestorage.app",messagingSenderId:"230354414241",appId:"1:230354414241:web:b365524169fb815b449ee0"});
const auth=getAuth(app),db=getFirestore(app);let userNow=null,oldData={};
function toast(msg,ok=false){const n=document.createElement("div");n.className="toast"+(ok?" success":"");n.textContent=msg;document.getElementById("toast-container").appendChild(n);setTimeout(()=>n.remove(),4500)}
const nameEl=document.getElementById("full-name"),nidEl=document.getElementById("national-id"),passEl=document.getElementById("new-password"),btn=document.getElementById("complete-btn");
nidEl.addEventListener("input",()=>nidEl.value=nidEl.value.replace(/[^0-9]/g,"").slice(0,10));
document.getElementById("password-eye").addEventListener("click",()=>{const show=passEl.type==="password";passEl.type=show?"text":"password";document.getElementById("password-eye").classList.toggle("fa-eye",show);document.getElementById("password-eye").classList.toggle("fa-eye-slash",!show)});
onAuthStateChanged(auth,async user=>{if(!user){location.replace("index.html");return}userNow=user;document.getElementById("account-email").textContent=user.email||"لا يوجد بريد مرتبط بالحساب";if(!user.email){toast("تعذر الحصول على بريد الحساب. افحص إعدادات GitHub OAuth.");return}try{const s=await getDoc(doc(db,"Users",user.uid));oldData=s.exists()?s.data():{};nameEl.value=user.displayName||"";if(oldData.registrationComplete&&user.emailVerified)location.replace("dashboard.html")}catch(e){console.error(e);toast("تعذر قراءة بيانات الحساب. حاول تحديث الصفحة.")}});
document.getElementById("complete-form").addEventListener("submit",async e=>{e.preventDefault();if(!userNow)return;const fullName=nameEl.value.trim().replace(/\s+/g," "),nid=nidEl.value.trim(),password=passEl.value;const count=fullName.split(" ").filter(Boolean).length;if(count<4||count>6)return toast("الاسم يجب أن يتكون من 4 إلى 6 أسماء.");if(!/^\d{10}$/.test(nid))return toast("الرقم الوطني يجب أن يتكون من 10 أرقام بالضبط.");if(password.length<8)return toast("كلمة المرور يجب ألا تقل عن 8 أحرف.");btn.disabled=true;btn.textContent="جارٍ حفظ البيانات...";
try{const cred=EmailAuthProvider.credential(userNow.email,password);try{await linkWithCredential(userNow,cred)}catch(e){if(e.code==="auth/credential-already-in-use")throw new Error("EMAIL_PASSWORD_IN_USE");if(e.code!=="auth/provider-already-linked")throw e}
const token=await userNow.getIdToken(true);const response=await fetch("/api/register-student",{method:"POST",headers:{"Content-Type":"application/json",Authorization:`Bearer ${token}`},body:JSON.stringify({fullName,nationalId:nid})});const payload=await response.json().catch(()=>({}));if(!response.ok)throw new Error(payload.error||"REGISTRATION_FAILED");await userNow.reload();if(!userNow.emailVerified){await sendEmailVerification(userNow,{url:"https://btec-cloud-portal.vercel.app/complete-verify.html",handleCodeInApp:false});toast("تم حفظ البيانات وإرسال رسالة تحقق إلى بريدك.",true);setTimeout(()=>location.replace("verify.html"),1200)}else{toast("اكتمل التسجيل بنجاح!",true);setTimeout(()=>location.replace("dashboard.html"),800)}
}catch(e){console.error(e);const map={NATIONAL_ID_EXISTS:"هذا الرقم الوطني مسجل مسبقاً.",EMAIL_PASSWORD_IN_USE:"كلمة المرور مرتبطة بحساب آخر.", "permission-denied":"لا تسمح قواعد Firestore بفحص الرقم الوطني. يلزم تعديل قواعد الأمان."};toast(map[e.message]||map[e.code]||("تعذر إكمال التسجيل: "+(e.code||e.message)))}finally{btn.disabled=false;btn.textContent="حفظ وإكمال التسجيل"}});
</script></body></html>
